name: collect
# Every Friday evening IST (RBI releases the WSS on Fridays) fetch the forex
# reserves table, append it to the archive if it is new, verify the whole
# chain, publish the head, and commit. The commit history itself is a second,
# independent witness of every head.
#
# The schedule is OFF until RBI replies to our request (notes/rbi-permission-letter.md):
# the RBI website terms ask for permission before caching or deep-linking its
# internal pages. Until then runs are manual only. To switch on, uncomment:
#  schedule:
#    - cron: "30 13 * * 5"   # 19:00 IST Friday
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release Friday to fetch (YYYY-MM-DD); blank = today"
        required: false
permissions:
  contents: write   # only to commit the new snapshot; nothing else
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2, pinned by commit
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0, pinned by commit
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest -q tests.test_kanakku tests.test_site
      - name: Fetch
        env:
          DATE_IN: ${{ github.event.inputs.date }}   # passed as data, never pasted into the script
        run: |
          D="$DATE_IN"
          [ -z "$D" ] && D=$(TZ=Asia/Kolkata date +%F)
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date must be YYYY-MM-DD"; exit 1; }
          python -m kanakku fetch-wss "$D" archive/rbi_fx.jsonl || echo "no table for $D"
      - name: Verify and witness
        run: |
          python -m kanakku verify archive/rbi_fx.jsonl --heads archive/heads.jsonl
          python -m kanakku witness archive/rbi_fx.jsonl archive/heads.jsonl
          cp archive/rbi_fx.jsonl docs/archive.jsonl
          cp archive/heads.jsonl docs/heads.jsonl
      - name: Commit
        run: |
          git config user.name "kanakku-bot"
          git config user.email "kanakku-bot@users.noreply.github.com"
          git add archive docs/archive.jsonl docs/heads.jsonl
          git diff --cached --quiet || git commit -m "Snapshot $(TZ=Asia/Kolkata date +%F)"
          git push
